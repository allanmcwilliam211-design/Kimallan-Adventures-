*{box-sizing:border-box}html,body{margin:0;min-height:100%;width:100%;overflow-x:hidden}body{font:15px/1.46 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(ellipse at 75% 0%,#242047 0%,transparent 42%),radial-gradient(ellipse at 0 33%,#092b3e 0%,transparent 39%),var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{touch-action:manipulation;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--cyan)}.shell{max-width:940px;margin:0 auto;padding:0 14px 100px}.hero{position:relative;margin:0 -14px 18px;min-height:174px;padding:24px 18px 16px;overflow:hidden;background:linear-gradient(120deg,#102445cc,#271744ee);border-bottom:1px solid #7d7acc4a}.hero svg{position:absolute;bottom:0;left:0;width:100%;height:120px;opacity:.37}.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 80% 3%,#9c6dff44,transparent 43%)}.hero-content{position:relative;z-index:1}.eyebrow{color:var(--cyan);font-size:10px;letter-spacing:2px;font-weight:850}.brand{margin:8px 0 5px;font-size:clamp(24px,7vw,34px);line-height:1.08;letter-spacing:-.9px;font-weight:950;text-shadow:0 0 20px #956cff45}.tag{font-size:12px;color:#c3cbe1;max-width:28em}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid #5288ac65;border-radius:100px;padding:6px 9px;font-size:11px;background:#102a43c9;color:#9fecef;white-space:nowrap}.sectiontop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 2px 10px}.sectiontop h2{font-size:20px;margin:0}.sectiontop small,.sub{color:var(--muted);font-size:12px}.card{border:1px solid #8199d02a;border-radius:19px;padding:17px;background:linear-gradient(155deg,#172747e8,#0c182de8);box-shadow:0 10px 30px #00000022;margin-bottom:13px;min-width:0}.card p{margin:8px 0;color:var(--muted)}h1,h2,h3{line-height:1.2}h1{font-size:25px;margin:7px kground:#392757aa}.eventgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.event{border:1px solid #647dad67;border-radius:17px;background:linear-gradient(145deg,#1b3255,#11233d);min-height:90px;padding:10px 7px;color:white;font-size:12px;font-weight:850;line-height:1.25}.event .emoji{display:block;font-size:29px;line-height:1.15;margin-bottom:7px}.divider{height:1px;background:#6985a238;margin:15px 0}.logitem{padding:10px 0;border-bottom:1px solid #7188ac33}.logitem:last-child{border-bottom:0}.logitem b{font-size:13px}.logmeta{font-size:11px;color:var(--muted);margin-top:3px}.lognote{font-size:12px;margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.input,label{display:block;width:100%}label{font-weight:750;font-size:12px;color:#d9e3f2;margin:11px 0 5px}.input{min-height:43px;padding:11px 12px;border:1px solid #567396;border-radius:11px;background:#0c1c34;color:white;outline:none}.input:focus{border-color:#43d9e3;box-shadow:0 0 0 2px #43d9e323}textarea.input{min-height:85px;resize:vertical}select.input{appearance:auto}.nav{position:fixed;bottom:0;left:0;right:0;max-width:940px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px 5px calc(8px + env(safe-area-inset-bottom));gap:3px;background:#081528ee;backdrop-filter:blur(14px);border-top:1px solid #56749a66;z-index:30}.nav button{border:0;border-radius:12px;background:transparent;color:#c0cfeb;padding:8px 1px;font-size:10px;min-height:54px;min-width:0;font-weight:750}.nav button span{display:block;font-size:21px;margin-bottom:2px}.nav button[aria-current=page]{background:linear-gradient(135deg,#6640db,#a04af0);color:white;box-shadow:0 0 18px #8d4cf155}.empty{text-align:center;padding:28px 18px}.empty .big{font-size:42px}.score{font-weight:930;font-size:48px;color:var(--green);line-height:1.1}.stars{display:flex;gap:5px}.stars button{border:1px solid #6c7f9c;border-radius:10px;background:#1b2b48;color:#7f8ca7;padding:7px 0;min-width:0;flex:1;font-size:25px}.stars button.on{color:var(--amber);border-color:var(--amber);background:#493b3e}.achievement{display:flex;gap:12px;align-items:center}.achievement .em{font-size:29px}.achievement strong{display:block}.achievement p{font-size:12px;margin:3px 0}.progress{background:#30415c;border-radius:10px;height:7px;overflow:hidden;margin-top:8px}.progress div{height:100%;background:var(--purple);border-radius:10px}.chartwrap{height:230px;position:relative}.chartwrap canvas{width:100%!important;height:100%!important}.statusline{font-size:12px;color:#a6eadd}.modalback{position:fixed;inset:0;background:#030712dd;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}.modal{width:100%;max-width:530px;max-height:90dvh;overflow:auto;background:#142441;border:1px solid #7d69c680;border-radius:22px;padding:19px;box-shadow:0 22px 70px #000b}.modal h2{margin:0 0 13px;font-size:22px}.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:430px;border-radius:17px;z-index:75;padding:14px;text-align:center;background:linear-gradient(135deg,#291b54,#123750);border:1px solid #bb95ff;box-shadow:0 0 33px #814dffc0;font-weight:830;font-size:13px;animation:popin .23s ease-out}.toast .small{display:block;color:#78f6c6;font-size:11px;margin-top:6px}@keyframes popin{from{opacity:0;transform:translate(-50%,22px)}to{opacity:1;transform:translate(-50%,0)}}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.bannersvg{height:33px;min-width:35px}.settingshint{background:#0c223b;border:1px solid #48789b55;border-radius:12px;padding:12px;font-size:12px;color:#c5d9ed}.settingshint code{overflow-wrap:anywhere}.visually-hidden{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:700px){.shell{padding:0 24px 105px}.hero{margin:0 -24px 22px;padding:32px 26px;min-height:190px}.metricgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.eventgrid{grid-template-columns:repeat(4,minmax(0,1fr))}.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:15px}.cols>.card{margin-bottom:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

<script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import {getFirestore,doc,onSnapshot,runTransaction} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';

const KEY='kimallan_adventures_final_v1';
const CONFIG_KEY='kimallan_firebase_config_v1';
const ID_KEY='kimallan_explorer_v1';
const DEFAULT=[35,20,60,10,5,5,10];
const metrics=[['Adventure Momentum','#33e5e2'],['Kim Chaos Vector','#aa85ff'],['Monster Reserves','#41e7a8'],['Story Value','#ffc46a'],['Eye Roll Velocity','#ff799c'],['Head Shake Index','#6ea8ff'],['Allan Concern Level','#ff8768']];
const events=[
 {e:'🌊',n:'Waterfall Discovered',d:[15,5,-2,18,2,1,3],alert:'UNPLANNED WATER FEATURE DETECTED'},
 {e:'🐕',n:'Dog Encounter',d:[6,4,0,12,0,0,-3],alert:'CANINE DISTRACTION PROTOCOL ACTIVATED'},
 {e:'⚡',n:'Monster Acquired',d:[5,-2,35,5,0,0,-10],alert:'EMERGENCY ENERGY RESERVES RESTORED'},
 {e:'🗺️',n:'Random Detour',d:[10,15,-5,12,8,7,12],alert:'ORIGINAL ROUTE NOW OPTIONAL'},
 {e:'🤦',n:'Risk Assessment Ignored',d:[5,20,0,12,18,15,20],alert:'RISK ASSESSMENT OVERRIDDEN'},
 {e:'🐄',n:'Cow Encounter',d:[7,15,0,15,10,12,14],alert:'BOVINE THREAT LEVEL ELEVATED'},
 {e:'🥶',n:'Cold Water Entry',d:[18,12,-8,20,5,4,10],alert:'UNSCHEDULED SWIMMING DETECTED'},
 {e:'🌀',n:'Wormhole Encounter',d:[12,25,-4,20,10,12,18],alert:'SPACETIME CONTINUUM BREACH'},
 {e:'⏳',n:'Accelerated Time Encounter',d:[15,12,-5,25,5,8,3],alert:'TEMPORAL DISTORTION CONFIRMED'},
 {e:'🏰',n:'Abandoned Place Discovered',d:[18,10,-5,20,3,5,8],alert:'UNEXPECTED EXPLORATION OPPORTUNITY'},
 {e:'🌄',n:'Scenic Viewpoint',d:[12,3,0,15,0,0,-5],alert:'SCENIC EXCELLENCE CONFIRMED'},
 {e:'🎲',n:'Random Event',d:[10,12,-5,15,8,8,10],alert:'CHAOS GENERATOR ACTIVATED'},
 {e:'🧭',n:'Got Lost',d:[4,20,-8,15,15,18,25],alert:'NAVIGATIONAL INTEGRITY FAILURE'}
];
const randomEvents=['SECRET WATERFALL DISCOVERED','DOG DISTRACTION INCIDENT','MONSTER SUPPLY CRISIS','UNSCHEDULED SWIM PROPOSED','BOVINE THREAT DETECTED','TEMPORAL RIFT IDENTIFIED','KIM HAS FOUND SOMETHING INTERESTING','RISK ASSESSMENT HAS LEFT THE CHAT'];
const blank=()=>({missions:[],activeId:null});
const $=q=>document.querySelector(q);
const el=$('#content');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(v,lo=0,hi=100)=>Math.max(lo,Math.min(hi,Number(v)||0));
const fmt=t=>new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const dur=m=>{m=Math.max(0,Math.round(m));return `${Math.floor(m/60)}h ${m%60}m`};
const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;
function restore(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&Array.isArray(v.missions)?v:blank()}catch{return blank()}}
let state=restore();let actor=localStorage.getItem(ID_KEY)==='Kim'?'Kim':'Allan';let tab='mission';let selectedId=null;let chart=null;let previousRing={};let cfg=null;let auth=null;let db=null;let docRef=null;let unsubscribe=null;let user=null;let connecting=false;let modalOpen=false;let alertMessage='ALL SYSTEMS OPERATIONAL. TEMPORAL INTEGRITY UNCONFIRMED.';
function localSave(){localStorage.setItem(KEY,JSON.stringify(state))}
const active=()=>state.missions.find(m=>m.id===state.activeId&&!m.end);
const latest=()=>state.missions.find(m=>m.end);
const currentReport=()=>state.missions.find(m=>m.id===selectedId&&m.end)||latest();
function counts(m){return m.events.filter(e=>!e.system).reduce((x,e)=>{x[e.actor]=(x[e.actor]||0)+1;return x},{Allan:0,Kim:0})}
function currentMode(){return cfg?'cloud':'local'}
function indicator(){const c=$('#connection');c.textContent=!cfg?'● LOCAL TEST MODE':user?'● PRIVATE SYNC CONNECTED':'● CLOUD LOGIN REQUIRED';c.style.color=user?'#54f3b7':cfg?'#ffcf83':'#9be6f0';$('#who').textContent=`Explorer: ${actor}`}
function notice(s){const r=$('#toastRoot');const t=document.createElement('div');t.className='toast';t.textContent='⚠️ '+s;const sub=document.createElement('span');sub.className='small';sub.textContent='✓ INCIDENT RECORDED';t.append(sub);r.replaceChildren(t);setTimeout(()=>{if(t.isConnected)t.remove()},3100)}
function modal(html){modalOpen=true;$('#overlay').innerHTML=`<div class="modalback" id="modalback"><section class="modal" role="dialog" aria-modal="true">${html}</section></div>`;$('#modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()})}
function closeModal(){modalOpen=false;$('#overlay').replaceChildren()}
async function commit(change){if(cfg){if(!user||!docRef){openSettings();throw Error('Sign in to save shared adventures.')}if(connecting)throw Error('Cloud connection not ready.');await runTransaction(db,async tx=>{const snapshot=await tx.get(docRef);const fresh=snapshot.exists()?snapshot.data():blank();if(!Array.isArray(fresh.missions))fresh.missions=[];const updated=structuredClone(fresh);const modified=change(updated);if(modified===false)return;tx.set(docRef,updated)});return}else{const fresh=structuredClone(state);const modified=change(fresh);if(modified===false)return;state=fresh;localSave();render()}}
function feedbackError(e){console.error(e);alert('Could not save: '+String(e?.message||e))}
const eachLog=m=>(m.events||[]).map(e=>`<div class="logitem"><b>${esc(e.emoji||'📌')} ${esc(e.name)}</b><div class="logmeta">${esc(e.actor||'System')} · ${fmt(e.time)}</div>${e.note?`<p class="lognote">${esc(e.note)}</p>`:''}</div>`).join('')||'<p class="muted">No incidents. Suspiciously peaceful.</p>';
function renderGauges(m){return `<div class="metricgrid">${m.stats.map((v,i)=>`<div class="metric"><div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="bgcircle" cx="60" cy="60" r="48"/><circle data-ring="${i}" class="fgcircle" cx="60" cy="60" r="48" stroke="${metrics[i][1]}" stroke-dasharray="301.593" stroke-dashoffset="301.593"/></svg><div class="ringval">${v}${i===4?'':'%'}</div></div><div class="metric-label">${metrics[i][0]}</div></div>`).join('')}</div>`}
function pageMission(){const m=active();if(!m)return `<div class="card empty"><div class="big">🧭</div><h1>Adventure HQ awaits</h1><p>No mission is active. The absence of chaos is deeply suspicious.</p><button class="btn fill" data-act="new">🚀 Start New Adventure</button></div>${state.missions.length?'<div class="card"><b>Previously classified adventures</b><p>Open Trips to browse completed missions and debriefs.</p></div>':''}`;
 return `<div class="card"><div class="row"><div class="kicker">CURRENT EXPEDITION</div><span class="pill">● MISSION ACTIVE</span></div><h1>${esc(m.name)}</h1><div class="sub">${esc(m.location||'Location classified')} · ${m.events.length} recorded incidents</div><div class="buttons" style="margin-top:15px"><button class="btn" data-tab="events">⚡ Log Event</button><button class="btn alt" data-act="edit" data-id="${m.id}">✎ Details</button></div></div><div class="sectiontop"><h2>Live Telemetry</h2><small>Not remotely scientific</small></div>${renderGauges(m)}<div class="alert purple" id="alertbox">⚠️ ${esc(alertMessage)}</div><div class="card"><div class="row"><h3>Telemetry history</h3><span class="tiny">Last ${Math.min(m.events.length,15)} incidents</span></div><div class="chartwrap"><canvas id="telemetryChart"></canvas></div><p class="tiny">Chart loads when connected to the internet.</p></div><div class="card"><h3>Recent incidents</h3>${eachLog({...m,events:m.events.slice(0,4)})}<div class="buttons" style="margin-top:10px"><button class="btn alt small" data-act="undo">↶ Undo Last Event</button><button class="btn alt small" data-act="reset">⟳ Reset Telemetry</button></div><div class="divider"></div><button class="btn danger fill" data-act="end">🏁 End Mission</button></div>`}
function pageEvents(){if(!active())return `<div class="card empty"><div class="big">⚡</div><h1>Event Console</h1><p>Start an adventure to activate the chaos generator.</p><button class="btn" data-act="new">Start Adventure</button></div>`;return `<div class="sectiontop"><h2>⚡ Event Console</h2><small>One-tap incident reporting</small></div><div class="card"><div class="row"><span class="kicker">LOGGING AS</span><strong>${actor==='Kim'?'🌀':'🧭'} ${actor}</strong></div><p class="tiny">To change explorer identity, use ⚙️ Setup.</p></div><div class="eventgrid">${events.map((e,i)=>`<button class="event" data-event="${i}"><span class="emoji">${e.e}</span>${e.n}</button>`).join('')}</div><div class="alert purple">⚠️ ${esc(alertMessage)}</div><div class="buttons" style="margin:12px 0"><button class="btn alt small" data-act="note">✎ Note on latest event</button><button class="btn alt small" data-act="undo">↶ Undo event</button></div><div class="card"><h3>Newest incidents</h3>${eachLog({...active(),events:active().events.slice(0,12)})}</div>`}
function pageTrips(){return `<div class="sectiontop"><h2>🗺️ Expedition Archive</h2></div><button class="btn fill" data-act="new">+ Start New Adventure</button><div style="height:14px"></div>${state.missions.length?state.missions.map(m=>`<div class="card"><div class="row"><span class="kicker">${m.end?'✓ COMPLETED':'● ACTIVE'}</span><span class="tiny">${fmt(m.start)}</span></div><h3 style="margin-top:10px">${esc(m.name)}</h3><p>📍 ${esc(m.location||'Location not added')}</p><p>${esc(m.description||'No description yet.')}</p><p class="tiny">⚡ ${m.events.length} recorded incidents</p>${m.journal?`<div class="alert">📖 ${esc(m.journal)}</div>`:''}<div class="buttons"><button class="btn alt small" data-act="edit" data-id="${m.id}">✎ Edit details</button>${m.end?`<button class="btn alt small" data-act="report" data-id="${m.id}">📋 Debrief</button>`:''}</div></div>`).join(''):'<div class="card empty">Nothing archived yet. This is highly irregular.</div>'}`}
function starRow(m,p){const rating=Number(m.ratings?.[p])||0;const can=actor===p;return `<div style="margin:15px 0"><div class="row"><b>${p==='Allan'?'🧭':'🌀'} ${p}'s rating</b><span class="tiny">${rating?rating+'/5':can?'Your turn':'Awaiting rating'}</span></div><div class="stars" style="margin-top:8px">${[1,2,3,4,5].map(n=>`<button aria-label="${p} ${n} stars" data-rate="${p}:${n}" ${!can?'disabled':''} class="${n<=rating?'on':''}">★</button>`).join('')}</div></div>`}
function temporalHTML(m){const elapsed=Math.round((m.end-m.start)/60000);const perceived=m.perceivedMinutes;let info='<p class="tiny">Enter how long the adventure felt. The Temporal Division will investigate.</p>';if(Number.isInteger(perceived)){if(elapsed<1)info='<div class="alert">Mission too short for meaningful temporal analysis.</div>';else{const delta=perceived<=elapsed?Math.round((1-perceived/elapsed)*100):Math.round((perceived/elapsed-1)*100);info=`<div class="alert purple">🌀 ${perceived<=elapsed?'TEMPORAL DISTORTION':'TEMPORAL EXPANSION'}: ${delta}%<br>${delta>=70?'CRITICAL TIME ANOMALY. Neither explorer is cooperating.':delta>=30?'SPACETIME INSTABILITY CONFIRMED.':'TEMPORAL FIELD RELATIVELY STABLE. Suspicious.'}</div>`}}
return `<div class="card"><h3>⏳ Temporal Distortion Monitor</h3><p>Actual duration: <strong>${elapsed<1?'Under 1 minute':dur(elapsed)}</strong></p><div class="fieldgrid"><div><label for="feelHours">Felt like · Hours</label><input class="input" type="number" min="0" max="999" id="feelHours" value="${Number.isInteger(perceived)?Math.floor(perceived/60):0}"></div><div><label for="feelMinutes">Minutes</label><input class="input" type="number" min="0" max="59" id="feelMinutes" value="${Number.isInteger(perceived)?perceived%60:30}"></div></div><button class="btn fill" style="margin-top:13px" data-act="temporal">🌀 Analyse Time Anomaly</button>${info}</div>`}
function pageDebrief(){const m=currentReport();if(!m)return '<div class="card empty"><div class="big">📋</div><h1>Awaiting Mission Completion</h1><p>Finish an expedition to unlock your joint debrief.</p></div>';const a=Number(m.ratings?.Allan)||0,k=Number(m.ratings?.Kim)||0;const ready=a>0&&k>0;const score=ready?num(Math.round(((a+k)/10)*75+m.stats[3]*.2+Math.min(5,m.events.length))):null;const verdict=!ready?'AWAITING BOTH EXPLORERS':score>=85?'MISSION COMPLETE: GLORIOUS SUCCESS':score>=65?'MISSION: SUCCESS':'MISSION COMPLETE: MEMORIES SECURED';const c=counts(m);return `<div class="sectiontop"><h2>📋 Mission Debrief</h2></div><div class="card"><div class="kicker">OFFICIAL EXPEDITION REPORT</div><h1>${esc(m.name)}</h1><p>${fmt(m.start)} — ${fmt(m.end)}</p><div class="alert purple">${verdict}</div>${ready?`<div class="score">${score}%</div><p class="tiny">Highly questionable official rating</p>`:'<p class="tiny">Each explorer rates their own experience to reveal the verdict.</p>'}${starRow(m,'Allan')}${starRow(m,'Kim')}<div class="divider"></div><h3>🕵️ Explorer Accountability</h3><p>🧭 Allan: ${c.Allan} incidents</p><p>🌀 Kim: ${c.Kim} incidents</p><p class="tiny">Conflicting accounts will be referred to the Department of Temporal Affairs.</p></div>${temporalHTML(m)}<div class="card"><h3>Full Mission Timeline</h3>${eachLog(m)}</div>`}
function pageAwards(){const all=state.missions.flatMap(m=>m.events).filter(e=>!e.system);const count=t=>all.filter(e=>e.name.includes(t)).length;const ach=[['🌊','Waterfall Hunter',count('Waterfall'),3],['🌀','Temporal Troublemakers',count('Wormhole')+count('Time'),3],['🐄','Cow Whisperers',count('Cow'),1],['🧭','Lost But Optimistic',count('Got Lost'),3],['🏰','Ruin Explorers',count('Abandoned'),3],['⚡','Monster Procurement Division',count('Monster'),5]];return `<div class="sectiontop"><h2>🏆 Questionable Achievements</h2></div>${ach.map(([emoji,name,v,goal])=>`<div class="card achievement"><span class="em">${emoji}</span><div style="flex:1"><strong>${name}</strong><p>${v}/${goal} incidents · ${v>=goal?'🏆 UNLOCKED':'🔒 LOCKED'}</p><div class="progress"><div style="width:${num(v/goal*100)}%"></div></div></div></div>`).join('')}<div class="card"><b>Total missions:</b> ${state.missions.length}<br><b>Total documented incidents:</b> ${all.length}</div>`}
function graph(m){if(chart){chart.destroy();chart=null}const canvas=$('#telemetryChart');if(!canvas||!window.Chart)return;const history=[...m.events].reverse();const data=[...history.map(e=>e.before).slice(0,1),...history.map((e,i)=>history[i+1]?.before||m.stats)];if(!data.length)data.push(m.stats);const indexes=[0,1,2,4];chart=new window.Chart(canvas,{type:'line',data:{labels:data.map((_,i)=>i===0?'Start':String(i)),datasets:indexes.map(i=>({label:metrics[i][0],data:data.map(x=>x[i]),borderColor:metrics[i][1],backgroundColor:metrics[i][1],tension:.35,pointRadius:2,borderWidth:2}))},options:{responsive:true,maintainAspectRatio:false,animation:{duration:550},interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{color:'#c5d7eb',font:{size:10},boxWidth:10}},tooltip:{backgroundColor:'#071327'}},scales:{x:{ticks:{color:'#849fbe',maxTicksLimit:7},grid:{color:'#36445a44'}},y:{min:0,max:100,ticks:{color:'#849fbe',stepSize:25},grid:{color:'#36445a66'}}}}})}
function animateRings(m){document.querySelectorAll('[data-ring]').forEach(path=>{const i=+path.dataset.ring;const goal=301.593*(1-m.stats[i]/100);const start=301.593*(1-(previousRing[i]??0)/100);path.style.transition='none';path.style.strokeDashoffset=start;requestAnimationFrame(()=>requestAnimationFrame(()=>{path.style.transition='stroke-dashoffset .85s cubic-bezier(.24,.82,.26,1)';path.style.strokeDashoffset=goal}))});previousRing={...m.stats}}
function render(){indicator();$('#nav').querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));el.innerHTML=({mission:pageMission,events:pageEvents,trips:pageTrips,debrief:pageDebrief,awards:pageAwards})[tab]();if(tab==='mission'&&active()){animateRings(active());graph(active())}else if(chart){chart.destroy();chart=null}}
function formMission(m){modal(`<h2>${m?'✎ Edit Adventure':'🚀 Start Adventure'}</h2><form id="missionForm"><label>Adventure name</label><input name="name" class="input" maxlength="90" required value="${esc(m?.name||'')}"><label>Location (optional)</label><input name="location" class="input" maxlength="130" value="${esc(m?.location||'')}"><label>What are we up to?</label><textarea name="description" class="input" maxlength="1200">${esc(m?.description||'')}</textarea><label>Expedition notes</label><textarea name="journal" class="input" maxlength="2500">${esc(m?.journal||'')}</textarea><div class="buttons" style="margin-top:13px"><button class="btn" type="submit">${m?'Save Details':'Start Mission'}</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div></form>`);$('#missionForm').addEventListener('submit',async ev=>{ev.preventDefault();const f=new FormData(ev.target);const name=String(f.get('name')||'').trim();if(!name)return;const info={name,location:String(f.get('location')||'').trim(),description:String(f.get('description')||''),journal:String(f.get('journal')||'')};try{await commit(s=>{if(m){const dest=s.missions.find(x=>x.id===m.id);if(!dest)throw Error('Adventure no longer exists.');Object.assign(dest,info)}else{if(s.missions.some(x=>x.id===s.activeId&&!x.end))throw Error('Finish the current mission first.');const id=uid();s.missions.unshift({id,...info,start:Date.now(),end:null,stats:[...DEFAULT],events:[],ratings:{}});s.activeId=id}});closeModal();tab='mission';render()}catch(e){feedbackError(e)}})}
function openSettings(){const configText=localStorage.getItem(CONFIG_KEY)||'';const email=localStorage.getItem('ka_allow_allan')||'';const kimEmail=localStorage.getItem('ka_allow_kim')||'';modal(`<h2>⚙️ Adventure HQ Setup</h2><div class="settingshint"><b>${cfg?'☁️ Shared cloud mode':'📱 Local test mode'}</b><br>${cfg?'Your app is configured for private syncing. Sign in below.':'This phone saves missions locally. For live sharing, connect Firebase below.'}</div><label>Who is using this phone?</label><select class="input" id="actorSelect"><option ${actor==='Allan'?'selected':''}>Allan</option><option ${actor==='Kim'?'selected':''}>Kim</option></select><div class="divider"></div><h3>☁️ Private Shared App</h3><p class="tiny">Paste the <b>firebaseConfig</b> block from your Firebase web-app setup. This is public app configuration, not a password.</p><textarea id="firebaseConfig" class="input" rows="6" placeholder='const firebaseConfig = { apiKey: "...", authDomain: "...", projectId: "...", appId: "..." };'>${esc(configText)}</textarea><div class="buttons"><button class="btn small" id="connectCloud">Connect Firebase</button><button class="btn ghost small" id="shareSetup">Copy Kim's setup link</button></div><div class="divider"></div><h3>🔒 Generate private database rules</h3><p class="tiny">Only these email addresses will be allowed to access the shared mission data.</p><label>Allan's login email</label><input class="input" type="email" id="allanEmail" value="${esc(email)}" placeholder="Allan's email"><label>Kim's login email (add later if needed)</label><input class="input" type="email" id="kimEmail" value="${esc(kimEmail)}" placeholder="Kim's email"><button class="btn alt fill" id="copyRules" style="margin-top:11px">Copy Firestore Security Rules</button><div class="divider"></div><h3>🔑 Explorer login</h3><p class="tiny">Create your own login here after enabling Email/Password sign-in in Firebase Authentication.</p><label>Email</label><input id="authEmail" class="input" type="email" autocomplete="email"><label>Password (at least 6 characters)</label><input id="authPass" class="input" type="password" autocomplete="current-password"><div class="buttons" style="margin-top:11px"><button class="btn small" id="login">Sign in</button><button class="btn alt small" id="signup">Create account</button><button class="btn ghost small" id="logout">Sign out</button></div><div id="authStatus" class="tiny" style="margin-top:10px">${user?'Signed in as '+esc(user.email):'Not signed in'}</div><div class="divider"></div><h3>💾 Backups</h3><div class="buttons"><button id="export" class="btn alt small">Download local data</button><button id="import" class="btn ghost small">Import JSON backup</button></div><input type="file" id="importFile" accept=".json,application/json" hidden><p class="tiny">Keep a backup before migrating. CodePen data does not automatically transfer to this app.</p><button class="btn ghost fill" style="margin-top:10px" data-act="close">Close Setup</button>`);$('#actorSelect').onchange=ev=>{actor=ev.target.value;localStorage.setItem(ID_KEY,actor);render()};$('#connectCloud').onclick=connectFromSettings;$('#shareSetup').onclick=copySetupLink;$('#copyRules').onclick=copyRules;$('#login').onclick=()=>login(false);$('#signup').onclick=()=>login(true);$('#logout').onclick=async()=>{if(auth)await signOut(auth)};$('#export').onclick=exportData;$('#import').onclick=()=>$('#importFile').click();$('#importFile').onchange=importData}
function parseConfig(s){try{const p=JSON.parse(s);if(p.apiKey&&p.projectId&&p.authDomain)return p}catch{}const matches=[...s.matchAll(/(apiKey|authDomain|projectId|appId|messagingSenderId|storageBucket|measurementId)\s*:\s*["']([^"']+)["']/g)];const v=Object.fromEntries(matches.map(m=>[m[1],m[2]]));if(!v.apiKey||!v.authDomain||!v.projectId)throw Error('Paste the full firebaseConfig from Firebase.');return v}
async function connectFromSettings(){try{const raw=$('#firebaseConfig').value.trim();const parsed=parseConfig(raw);localStorage.setItem(CONFIG_KEY,raw);cfg=parsed;await setupFirebase();closeModal();render();alert('Firebase configured! Now sign in from Setup.')}catch(e){feedbackError(e)}}
function allowEmails(){const a=$('#allanEmail').value.trim().toLowerCase(),k=$('#kimEmail').value.trim().toLowerCase();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(a))throw Error('Enter Allan’s valid login email first.');if(k&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(k))throw Error('Kim’s email address is invalid.');localStorage.setItem('ka_allow_allan',a);localStorage.setItem('ka_allow_kim',k);return [...new Set([a,k].filter(Boolean))]}
async function copyRules(){try{const list=allowEmails().map(e=>JSON.stringify(e)).join(', ');const rules=`rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /teams/kimallan {\n      allow read, write: if request.auth != null\n        && request.auth.token.email in [${list}];\n    }\n  }\n}`;await copyText(rules);alert('Private Firestore rules copied. Paste into Firestore Database → Rules and Publish.')}catch(e){feedbackError(e)}}
async function copyText(s){if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(s)}else{const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();if(!document.execCommand('copy'))throw Error('Clipboard unavailable');t.remove()}}
async function copySetupLink(){try{const raw=$('#firebaseConfig').value||localStorage.getItem(CONFIG_KEY);const conf=parseConfig(raw);if(!location.protocol.startsWith('http'))throw Error('Publish the app online before making Kim’s link.');const u=new URL(location.href);u.searchParams.set('setup',btoa(JSON.stringify(conf)));await copyText(u.href);alert('Setup link copied. Kim can open it, select her name, then sign in. Share privately.')}catch(e){feedbackError(e)}}
async function login(create){if(!auth){alert('Connect Firebase first.');return}const email=$('#authEmail').value.trim();const pass=$('#authPass').value;try{if(create)await createUserWithEmailAndPassword(auth,email,pass);else await signInWithEmailAndPassword(auth,email,pass);closeModal();render()}catch(e){feedbackError(e)}}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='KimAllan-Adventures-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function importData(ev){const f=ev.target.files?.[0];if(!f)return;f.text().then(async s=>{try{const imported=JSON.parse(s);if(!Array.isArray(imported.missions))throw Error('Not a valid adventure backup.');if(!confirm('Replace existing adventures with this backup?'))return;await commit(x=>{x.missions=imported.missions;x.activeId=imported.activeId??null});closeModal();render()}catch(e){feedbackError(e)}})}
async function setupFirebase(){if(!cfg)return;const existing=getApps().find(x=>x.name==='kimallan');const app=existing||initializeApp(cfg,'kimallan');auth=getAuth(app);db=getFirestore(app);docRef=doc(db,'teams','kimallan');onAuthStateChanged(auth,async u=>{user=u;if(unsubscribe){unsubscribe();unsubscribe=null}if(u){connecting=false;unsubscribe=onSnapshot(docRef,snap=>{state=snap.exists()?snap.data():blank();if(!Array.isArray(state.missions))state=blank();render()},err=>{console.error(err);alert('Private sync error: '+err.message+' Check your Firestore rules and login email.')})}else{state=restore();render()}})}
async function initializeShared(){const url=new URL(location.href);const shared=url.searchParams.get('setup');if(shared&&!localStorage.getItem(CONFIG_KEY)){try{const parsed=JSON.parse(atob(shared));const raw=JSON.stringify(parsed);parseConfig(raw);localStorage.setItem(CONFIG_KEY,raw)}catch{}}url.searchParams.delete('setup');history.replaceState(null,'',url.pathname+url.search+url.hash);const raw=localStorage.getItem(CONFIG_KEY);if(raw){try{cfg=parseConfig(raw);await setupFirebase()}catch(e){console.error('Firebase configuration error',e);cfg=null;alert('Could not connect Firebase. Check Setup.')}}render()}

async function logEvent(i){const m=active();if(!m)return;let def=events[i],name=def.n,warning=def.alert,changes=def.d;if(i===11){warning=randomEvents[Math.floor(Math.random()*randomEvents.length)];name='Random Event: '+warning}try{await commit(s=>{const mission=s.missions.find(x=>x.id===s.activeId&&!x.end);if(!mission)throw Error('Mission already completed.');const before=[...mission.stats];mission.stats=mission.stats.map((v,j)=>num(v+changes[j]));mission.events.unshift({id:uid(),name,emoji:def.e,actor,time:Date.now(),note:'',message:warning,before});});alertMessage=warning;notice(warning);render()}catch(e){feedbackError(e)}}
async function undo(){const m=active();if(!m?.events.length)return alert('Nothing to undo.');const e=m.events[0];if(e.actor!==actor&&e.actor!=='System')return alert('Only the explorer who logged the latest event can undo it.');if(!confirm('Undo the most recent event?'))return;try{await commit(s=>{const x=s.missions.find(x=>x.id===s.activeId&&!x.end);if(!x?.events.length)throw Error('No event found.');if(x.events[0].id!==e.id)throw Error('Another event was logged; try again.');const removed=x.events.shift();x.stats=removed.before});alertMessage='LATEST INCIDENT REVERSED';render()}catch(e){feedbackError(e)}}
async function reset(){if(!active())return;if(!confirm('Recalibrate all seven gauges? Your adventure history stays intact.'))return;try{await commit(s=>{const x=s.missions.find(x=>x.id===s.activeId&&!x.end);const before=[...x.stats];x.stats=[...DEFAULT];x.events.unshift({id:uid(),name:'Telemetry Recalibrated',emoji:'⟳',actor:'System',time:Date.now(),note:'Seven gauges reset.',message:'SYSTEM RECALIBRATED',before,system:true})});alertMessage='TELEMETRY RECALIBRATED. SYSTEMS QUESTIONABLY STABLE.';render()}catch(e){feedbackError(e)}}
function addNote(){const m=active();const item=m?.events[0];if(!item)return alert('Log an event first.');modal(`<h2>✎ Incident Note</h2><p class="muted">${esc(item.name)}</p><form id="noteForm"><label>What happened?</label><textarea class="input" id="noteText" maxlength="2000">${esc(item.note||'')}</textarea><div class="buttons" style="margin-top:10px"><button class="btn">Save Note</button><button class="btn ghost" type="button" data-act="close">Cancel</button></div></form>`);$('#noteForm').onsubmit=async ev=>{ev.preventDefault();try{const note=$('#noteText').value;await commit(s=>{const x=s.missions.find(x=>x.id===m.id),e=x?.events.find(y=>y.id===item.id);if(!e)throw Error('Incident missing.');e.note=note});closeModal()}catch(e){feedbackError(e)}}}
async function end(){const m=active();if(!m)return;if(!confirm(`Finish “${m.name}” and create the official debrief?`))return;try{await commit(s=>{const x=s.missions.find(x=>x.id===m.id&&!x.end);if(!x)throw Error('Mission already ended.');x.end=Date.now();s.activeId=null});selectedId=m.id;tab='debrief';render()}catch(e){feedbackError(e)}}
async function rate(w){const [who,n]=w.split(':');if(who!==actor)return;if(!currentReport())return;const id=currentReport().id;try{await commit(s=>{const m=s.missions.find(x=>x.id===id);if(!m)throw Error('Mission missing.');m.ratings=m.ratings||{};m.ratings[who]=Number(n)})}catch(e){feedbackError(e)}}
async function temporal(){const m=currentReport();if(!m)return;const h=Number($('#feelHours').value),n=Number($('#feelMinutes').value);if(!Number.isInteger(h)||!Number.isInteger(n)||h<0||h>999||n<0||n>59||h*60+n===0)return alert('Enter valid hours and minutes.');try{await commit(s=>{s.missions.find(x=>x.id===m.id).perceivedMinutes=h*60+n})}catch(e){feedbackError(e)}}
$('#settingsOpen').addEventListener('click',openSettings);
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;render();window.scrollTo({top:0,behavior:'instant'})});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.event!==undefined){logEvent(Number(b.dataset.event));return}if(b.dataset.rate){rate(b.dataset.rate);return}if(b.dataset.tab){tab=b.dataset.tab;render();return}const act=b.dataset.act;if(!act)return;switch(act){case 'new':if(active())alert('Finish your current mission before starting another.');else formMission(null);break;case 'edit':formMission(state.missions.find(x=>x.id===b.dataset.id));break;case 'report':selectedId=b.dataset.id;tab='debrief';render();break;case 'end':end();break;case 'reset':reset();break;case 'undo':undo();break;case 'note':addNote();break;case 'temporal':temporal();break;case 'close':closeModal();break}});
initializeShared();
</script>
</body>
</html>
